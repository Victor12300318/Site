version: '3.8'

services:
  hds-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hds-site
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
